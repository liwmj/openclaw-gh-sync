name: Bug report
description: 报告一个可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？预期是什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 最小可复现路径（命令 + 配置）
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 插件版本 / Node 版本 / 操作系统
    validations:
      required: true
