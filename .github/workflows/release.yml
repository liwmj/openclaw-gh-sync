name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
      - name: Publish to ClawHub
        run: |
          npx clawhub auth login --token "${{ secrets.CLAWHUB_TOKEN }}" --label "github-actions"
          npx clawhub package publish . --version "${GITHUB_REF_NAME#v}" --wait --json
